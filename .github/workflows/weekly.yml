name: Weekly literature check

on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC (07:17 Copenhagen summer time)
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Discover and screen
        id: tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: python -m tracker.run

      - name: Commit results
        run: |
          git config user.name "literature-bot"
          git config user.email "literature-bot@users.noreply.github.com"
          git add data digests
          git diff --cached --quiet || git commit -m "Weekly update $(date -u +%F)"
          git push

      - name: Open digest issue
        if: steps.tracker.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "New GenAI causal papers: ${{ steps.tracker.outputs.new_count }} ($(date -u +%F))" \
            --body-file "${{ steps.tracker.outputs.digest }}"
